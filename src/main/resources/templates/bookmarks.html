<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>My Bookmarks - Anveshana</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f8f9fa;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --text-color: #212529;
            --accent-color: #0d6efd;
            --border-color: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #0b1120;
            --nav-bg: #020617;
            --card-bg: #111827;
            --text-color: #e5e7eb;
            --accent-color: #38bdf8;
            --border-color: rgba(255,255,255,0.12);
        }

        [data-theme="sunset"] {
            --bg-color: #fff7ed;
            --nav-bg: #fffbeb;
            --card-bg: #ffffff;
            --text-color: #1f2933;
            --accent-color: #f97316;
            --border-color: rgba(0,0,0,0.12);
        }

        [data-theme="forest"] {
            --bg-color: #0f172a;
            --nav-bg: #020617;
            --card-bg: #020617;
            --text-color: #e2f3e9;
            --accent-color: #22c55e;
            --border-color: rgba(255,255,255,0.15);
        }

        [data-theme="royal"] {
            --bg-color: #f5f3ff;
            --nav-bg: #eef2ff;
            --card-bg: #ffffff;
            --text-color: #111827;
            --accent-color: #6366f1;
            --border-color: rgba(0,0,0,0.12);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Top nav */
        .top-nav {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            text-decoration: none;
        }

        .theme-select {
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            min-width: 135px;
        }

        .theme-select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        .profile-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            font-weight: 600;
        }

        .dropdown-menu {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .dropdown-item {
            color: var(--text-color);
        }

        .dropdown-item:hover {
            background-color: rgba(148,163,184,0.15);
        }

        /* Bookmark card */
        .bookmark-card {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
            padding: 1.5rem 2rem;
            margin-bottom: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .bookmark-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.25);
        }

        .bookmark-title {
            font-weight: 600;
            color: var(--accent-color);
            text-decoration: none;
        }

        .bookmark-path {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .bookmark-snippet {
            font-size: 0.9rem;
            white-space: pre-wrap;
        }

        .bookmark-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }

        .btn-back {
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

<!-- NAV -->
<nav class="top-nav">
    <div class="d-flex align-items-center gap-3">
        <a href="/" class="logo">Anveshana</a>

        <!-- Spacer to push right-side items -->
        <div class="flex-grow-1"></div>

        <select id="themeSelect" class="theme-select">
            <option value="light">🌞 Light</option>
            <option value="dark">🌙 Dark</option>
            <option value="sunset">🌅 Sunset</option>
            <option value="forest">🌲 Forest</option>
            <option value="royal">👑 Royal</option>
        </select>

        <div class="dropdown">
            <button class="profile-btn dropdown-toggle" data-bs-toggle="dropdown">
                <span th:text="${#authentication.name.substring(0,1).toUpperCase()}"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/">Home</a></li>
                <li><a class="dropdown-item" th:href="@{/bookmarks}">My Bookmarks</a></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- BACK BUTTON -->
<div class="container mt-4">
    <button class="btn btn-outline-secondary btn-sm btn-back" onclick="goBack()">← Back</button>
</div>

<!-- BOOKMARKS LIST -->
<div class="container mt-2">
    <div class="row justify-content-center">
        <div class="col-lg-9">

            <h3 class="mb-4">⭐ My Bookmarks</h3>

            <div th:if="${#lists.isEmpty(bookmarks)}" class="alert alert-info">
                You have no bookmarks yet.
            </div>

            <div th:each="bookmark : ${bookmarks}" class="bookmark-card">
                <!-- LINK TO DOCUMENT WITHOUT QUERY HIGHLIGHT -->
                <a th:href="@{/document/{docId}(docId=${bookmark.docId})}"
                   class="bookmark-title"
                   th:text="${bookmark.title != null ? bookmark.title : bookmark.path.substring(bookmark.path.lastIndexOf('/') + 1)}"></a>

                <div class="bookmark-path" th:text="${bookmark.path}"></div>

                <div class="bookmark-snippet" th:utext="${bookmark.queryAtBookmark != null ? bookmark.queryAtBookmark : ''}"></div>

                <div class="bookmark-actions">
                    <form th:action="@{/bookmarks/remove}" method="post">
                        <input type="hidden" name="docId" th:value="${bookmark.docId}"/>
                        <input type="hidden" name="redirectTo" value="/bookmarks"/>
                        <button type="submit" class="btn btn-outline-danger btn-sm">✕ Remove</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    (function () {
        const root = document.documentElement;
        const select = document.getElementById("themeSelect");

        function applyTheme(theme) {
            root.setAttribute("data-theme", theme);
            localStorage.setItem("anveshana-theme", theme);
        }

        const saved = localStorage.getItem("anveshana-theme");
        if (saved) {
            select.value = saved;
            applyTheme(saved);
        }

        select.addEventListener("change", () => applyTheme(select.value));
    })();

    function goBack() {
        if (document.referrer) {
            window.history.back();
        } else {
            window.location.href = '/';
        }
    }
</script>

</body>
</html>
