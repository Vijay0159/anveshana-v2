<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Anveshana – My AI Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa; --nav-bg: #ffffff; --card-bg: #ffffff;
            --text-color: #212529; --accent-color: #0d6efd;
            --border-color: rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg-color: #0b1120; --nav-bg: #020617; --card-bg: #111827;
            --text-color: #e5e7eb; --accent-color: #38bdf8;
            --border-color: rgba(255,255,255,0.12);
        }
        [data-theme="sunset"] {
            --bg-color: #fff7ed; --nav-bg: #fffbeb; --card-bg: #ffffff;
            --text-color: #1f2933; --accent-color: #f97316;
            --border-color: rgba(0,0,0,0.12);
        }
        [data-theme="forest"] {
            --bg-color: #0f172a; --nav-bg: #020617; --card-bg: #020617;
            --text-color: #e2f3e9; --accent-color: #22c55e;
            --border-color: rgba(255,255,255,0.15);
        }
        [data-theme="royal"] {
            --bg-color: #f5f3ff; --nav-bg: #eef2ff; --card-bg: #ffffff;
            --text-color: #111827; --accent-color: #6366f1;
            --border-color: rgba(0,0,0,0.12);
        }

        body { background-color: var(--bg-color); color: var(--text-color); }

        .top-nav {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
        }
        .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent-color); text-decoration: none; }
        .theme-select {
            background-color: var(--card-bg); color: var(--text-color);
            border-radius: 999px; padding: 0.35rem 0.75rem;
            border: 1px solid var(--border-color); font-size: 0.8rem; min-width: 135px;
        }
        .profile-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background-color: var(--accent-color); color: #fff; border: none; font-weight: 600;
        }
        .dropdown-menu { background-color: var(--card-bg); border: 1px solid var(--border-color); }
        .dropdown-item { color: var(--text-color); }
        .dropdown-item:hover { background-color: rgba(148,163,184,0.15); }

        .library-container { max-width: 900px; margin-top: 1.5rem; }

        .doc-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
        }

        .doc-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent-color);
            text-decoration: none;
        }
        .doc-title:hover { text-decoration: underline; }

        .doc-meta {
            font-size: 0.78rem;
            opacity: 0.6;
            margin-top: 0.2rem;
        }

        .doc-preview {
            font-size: 0.88rem;
            margin-top: 0.6rem;
            opacity: 0.85;
            white-space: pre-wrap;
            max-height: 80px;
            overflow: hidden;
        }

        .expand-toggle {
            font-size: 0.78rem;
            cursor: pointer;
            color: var(--accent-color);
            background: none;
            border: none;
            padding: 0;
            margin-top: 0.3rem;
        }
    </style>
</head>

<body>

<!-- TOP NAV -->
<nav class="top-nav">
    <div class="d-flex align-items-center gap-3">
        <a href="/" class="logo">Anveshana</a>

        <form action="/search" method="get" class="flex-grow-1">
            <input type="text" name="q" class="form-control"
                   style="border-radius:999px; background-color:var(--card-bg); color:var(--text-color); border:1px solid var(--border-color);"
                   placeholder="Search Anveshana">
        </form>

        <select id="themeSelect" class="theme-select">
            <option value="light">🌞 Light</option>
            <option value="dark">🌙 Dark</option>
            <option value="sunset">🌅 Sunset</option>
            <option value="forest">🌲 Forest</option>
            <option value="royal">👑 Royal</option>
        </select>

        <div class="dropdown">
            <button class="profile-btn dropdown-toggle" data-bs-toggle="dropdown">
                <span th:text="${#authentication.name.substring(0,1).toUpperCase()}"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" th:href="@{/bookmarks}">My Bookmarks</a></li>
                <li><a class="dropdown-item active" th:href="@{/ai-library}">My AI Library</a></li>
                <li>
                    <form th:action="@{/logout-and-clear}" method="post">
                        <button type="submit" class="dropdown-item">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- LIBRARY -->
<div class="container library-container">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h5 class="mb-0">📚 My AI Library</h5>
            <small class="opacity-50">AI-generated results you've saved</small>
        </div>
        <a href="/" class="btn btn-outline-secondary btn-sm">← Back to Search</a>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible" th:text="${error}"></div>

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(docs)}" class="alert alert-info">
        Your AI Library is empty. Search for something and click
        <strong>Save to My Library</strong> on the AI tab.
    </div>

    <!-- DOCUMENT CARDS -->
    <div th:each="doc, stat : ${docs}" class="doc-card">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <div class="doc-title" th:text="${doc.title}"></div>
                <div class="doc-meta">
                    Query: "<span th:text="${doc.query}"></span>"
                    &nbsp;·&nbsp;
                    Saved on <span th:text="${#temporals.format(doc.createdAt, 'dd MMM yyyy, HH:mm')}"></span>
                </div>
            </div>

            <div class="d-flex gap-2 ms-3">
                <!-- Re-search this query across all tabs -->
                <a th:href="@{/search(q=${doc.query})}"
                   class="btn btn-sm btn-outline-primary">🔍 Search</a>

                <!-- Delete -->
                <form th:action="@{/ai-results/delete}" method="post">
                    <input type="hidden" name="id" th:value="${doc.id}">
                    <button type="submit" class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Delete this saved result?')">
                        🗑 Delete
                    </button>
                </form>
            </div>
        </div>

        <!-- Content preview with expand -->
        <div class="doc-preview" th:id="'preview-' + ${stat.index}"
             th:text="${th:text="${doc.content != null ? #strings.substring(doc.content, 0, doc.content.length() > 300 ? 300 : doc.content.length()) : ''}"}">
        </div>
        <div th:if="${doc.content.length() > 300}">
            <button class="expand-toggle"
                    th:attr="onclick='toggleExpand(' + ${stat.index} + ', \'' + ${#strings.escapeJavaScript(doc.content)} + '\')'">
                Show more ▼
            </button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Theme
    (function () {
        const root = document.documentElement;
        const select = document.getElementById("themeSelect");
        function applyTheme(theme) {
            root.setAttribute("data-theme", theme);
            localStorage.setItem("anveshana-theme", theme);
        }
        const saved = localStorage.getItem("anveshana-theme");
        if (saved) { select.value = saved; applyTheme(saved); }
        select.addEventListener("change", () => applyTheme(select.value));
    })();

    // Expand/collapse content preview
    function toggleExpand(index, fullContent) {
        const preview = document.getElementById('preview-' + index);
        const btn = preview.nextElementSibling.querySelector('button');
        if (preview.style.maxHeight === 'none') {
            preview.style.maxHeight = '80px';
            preview.style.overflow = 'hidden';
            btn.textContent = 'Show more ▼';
        } else {
            preview.textContent = fullContent;
            preview.style.maxHeight = 'none';
            preview.style.overflow = 'visible';
            btn.textContent = 'Show less ▲';
        }
    }
</script>

</body>
</html>
