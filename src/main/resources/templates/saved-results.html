<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Anveshana – Saved Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa; --nav-bg: #ffffff; --card-bg: #ffffff;
            --text-color: #212529; --accent-color: #0d6efd;
            --border-color: rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg-color: #0b1120; --nav-bg: #020617; --card-bg: #111827;
            --text-color: #e5e7eb; --accent-color: #38bdf8;
            --border-color: rgba(255,255,255,0.12);
        }
        [data-theme="sunset"] {
            --bg-color: #fff7ed; --nav-bg: #fffbeb; --card-bg: #ffffff;
            --text-color: #1f2933; --accent-color: #f97316;
            --border-color: rgba(0,0,0,0.12);
        }
        [data-theme="forest"] {
            --bg-color: #0f172a; --nav-bg: #020617; --card-bg: #020617;
            --text-color: #e2f3e9; --accent-color: #22c55e;
            --border-color: rgba(255,255,255,0.15);
        }
        [data-theme="royal"] {
            --bg-color: #f5f3ff; --nav-bg: #eef2ff; --card-bg: #ffffff;
            --text-color: #111827; --accent-color: #6366f1;
            --border-color: rgba(0,0,0,0.12);
        }

        body { background-color: var(--bg-color); color: var(--text-color); }

        .top-nav {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
        }
        .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent-color); text-decoration: none; }
        .search-input {
            border-radius: 999px; padding: 0.45rem 1rem;
            background-color: var(--card-bg); color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        .search-input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 0.15rem rgba(56,189,248,0.25); }
        .theme-select {
            background-color: var(--card-bg); color: var(--text-color);
            border-radius: 999px; padding: 0.35rem 0.75rem;
            border: 1px solid var(--border-color); font-size: 0.8rem; min-width: 135px;
        }
        .profile-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background-color: var(--accent-color); color: #fff; border: none; font-weight: 600;
        }
        .dropdown-menu { background-color: var(--card-bg); border: 1px solid var(--border-color); }
        .dropdown-item { color: var(--text-color); }
        .dropdown-item:hover { background-color: rgba(148,163,184,0.15); }

        .results-container { max-width: 900px; margin-top: 1.5rem; }

        .result-title {
            color: var(--accent-color); font-weight: 600;
            text-decoration: none; font-size: 1.1rem;
        }
        .result-title:hover { text-decoration: underline; }
        .path-muted { font-size: 0.8rem; opacity: 0.65; }
        .snippet mark { background-color: rgba(250,204,21,0.3); }

        .score-badge {
            display: inline-block; font-size: 0.7rem; font-weight: 600;
            padding: 0.2rem 0.45rem; border-radius: 999px;
            background-color: rgba(56,189,248,0.15); color: var(--accent-color);
            margin-left: 0.4rem;
        }

        .nav-tabs { border-color: var(--border-color); }
        .nav-tabs .nav-link { color: var(--text-color); border-color: transparent; }
        .nav-tabs .nav-link.active {
            background-color: var(--card-bg); color: var(--accent-color);
            border-color: var(--border-color) var(--border-color) var(--card-bg);
            font-weight: 600;
        }
        .nav-tabs .nav-link:hover { border-color: var(--border-color); }
    </style>
</head>

<body>

<!-- TOP NAV -->
<nav class="top-nav">
    <div class="d-flex align-items-center gap-3">
        <a href="/" class="logo">Anveshana</a>

        <form th:action="@{/search}" method="get" class="flex-grow-1">
            <input type="text" name="q" class="form-control search-input"
                   placeholder="Search Anveshana" th:value="${query}">
        </form>

        <select id="themeSelect" class="theme-select">
            <option value="light">🌞 Light</option>
            <option value="dark">🌙 Dark</option>
            <option value="sunset">🌅 Sunset</option>
            <option value="forest">🌲 Forest</option>
            <option value="royal">👑 Royal</option>
        </select>

        <div class="dropdown">
            <button class="profile-btn dropdown-toggle" data-bs-toggle="dropdown">
                <span th:text="${#authentication.name.substring(0,1).toUpperCase()}"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" th:href="@{/bookmarks}">My Bookmarks</a></li>
                <li><a class="dropdown-item" th:href="@{/ai-library}">My AI Library</a></li>
                <li><a class="dropdown-item" th:href="@{/groups}">My Groups</a></li>
                <li>
                    <form th:action="@{/logout-and-clear}" method="post">
                        <button type="submit" class="dropdown-item">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- RESULTS -->
<div class="container results-container">

    <a href="/" class="btn btn-outline-secondary btn-sm mb-3">← New Search</a>

    <!-- TABS -->
    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/search(q=${query})}">🗂 Local Results</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/ai-search(q=${query})}">🤖 AI Results</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" th:href="@{/saved-search(q=${query})}">📚 Saved</a>
        </li>
    </ul>

    <p class="small">
        <strong th:text="${count}"></strong> saved result(s) matched
        "<span th:text="${query}"></span>"
    </p>

    <!-- EMPTY STATE -->
    <div th:if="${count == 0}" class="alert alert-info">
        No saved AI results matched "<span th:text="${query}"></span>".
        <a th:href="@{/ai-search(q=${query})}">Try the AI tab →</a>
    </div>

    <!-- RESULTS LIST -->
    <div th:each="result : ${results}" class="mb-4">
        <a th:href="@{/ai-library}" class="result-title">
            <span th:text="${result.document.title}"></span>
            <span class="score-badge">
                Score <span th:text="${#numbers.formatDecimal(result.score, 1, 2)}"></span>
            </span>
        </a>

        <div class="path-muted">
            Saved on <span th:text="${#temporals.format(result.document.createdAt, 'dd MMM yyyy, HH:mm')}"></span>
            &nbsp;·&nbsp; Query: "<span th:text="${result.document.query}"></span>"
        </div>

        <p class="snippet mt-1" th:utext="${result.snippet}"></p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        const root = document.documentElement;
        const select = document.getElementById("themeSelect");
        function applyTheme(theme) {
            root.setAttribute("data-theme", theme);
            localStorage.setItem("anveshana-theme", theme);
        }
        const saved = localStorage.getItem("anveshana-theme");
        if (saved) { select.value = saved; applyTheme(saved); }
        select.addEventListener("change", () => applyTheme(select.value));
    })();
</script>

</body>
</html>
