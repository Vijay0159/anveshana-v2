<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Sign up - Anveshana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --accent-color: #0d6efd;
            --border-color: #e0e0e0;
            --shadow-color: rgba(15, 23, 42, 0.15);
        }
        [data-theme="dark"] {
            --bg-color: #0b1120;
            --card-bg: #111827;
            --text-color: #e5e7eb;
            --accent-color: #38bdf8;
            --border-color: #374151;
        }
        [data-theme="sunset"] {
            --bg-color: #fff7ed;
            --card-bg: #fffbeb;
            --text-color: #1f2933;
            --accent-color: #f97316;
            --border-color: #fcd34d;
        }
        [data-theme="forest"] {
            --bg-color: #0f172a;
            --card-bg: #020617;
            --text-color: #e2f3e9;
            --accent-color: #22c55e;
            --border-color: #047857;
        }
        [data-theme="royal"] {
            --bg-color: #f5f3ff;
            --card-bg: #eef2ff;
            --text-color: #111827;
            --accent-color: #6366f1;
            --border-color: #a5b4fc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-card {
            background-color: var(--card-bg);
            padding: 2rem 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px var(--shadow-color);
            max-width: 400px;
            width: 100%;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .brand-subtitle {
            font-size: 0.9rem;
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 1.5rem;
        }

        .form-control {
            border-radius: 0.75rem;
            border: 1.5px solid #d1d5db;
            padding: 0.75rem 1rem;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            color: var(--text-color);
        }
        [data-theme="dark"] .form-control {
            background: rgba(31, 41, 55, 0.85);
            border-color: #4b5563;
            color: #f9fafb;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.15);
            background: #ffffff;
        }
        [data-theme="dark"] .form-control:focus { background: #1f293b; }

        ::placeholder { color: rgba(31, 41, 55, 0.5); opacity: 1; }
        [data-theme="dark"] ::placeholder { color: rgba(255,255,255,0.6); opacity: 1; }

        .btn-signup {
            width: 100%;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, var(--accent-color) 0%, #0b5ed7 100%);
            border: none;
            color: #fff;
            transition: all 0.2s ease;
        }
        .btn-signup:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .alert { border-radius: 0.75rem; font-size: 0.9rem; }

        .login-link {
            color: var(--accent-color);
            font-weight: 500;
            text-decoration: none;
        }
        .login-link:hover { text-decoration: underline; }

        .theme-select {
            max-width: 140px;
            font-size: 0.875rem;
            padding: 0.4rem 0.6rem;
            border-radius: 0.5rem;
            border: 2px solid #e5e7eb;
            background-color: var(--card-bg);
            color: var(--text-color);
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            cursor: pointer;
            appearance: none;
            font-weight: 500;
        }
        [data-theme="dark"] .theme-select {
            border-color: #4b5563;
            background-color: #1f293b;
            color: #f9fafb;
        }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="text-center mb-4">
        <h1 class="brand-title">🔍 Anveshana</h1>
        <p class="brand-subtitle">Create your account</p>
    </div>

    <div th:if="${error}" class="alert alert-danger">Registration failed. Please try again.</div>

    <form th:action="@{/signup}" th:object="${userForm}" method="post">
        <div class="mb-3">
            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Full name" required>
        </div>
        <div class="mb-3">
            <input type="email" th:field="*{email}" class="form-control" placeholder="Email address" required>
        </div>
        <div class="mb-3">
            <input type="password" th:field="*{password}" class="form-control" placeholder="Password (min 6 characters)" required minlength="6">
        </div>
        <button type="submit" class="btn btn-signup mb-3">Create account</button>
    </form>

    <p class="text-center mb-0">Already have an account? <a href="/login" class="login-link">Sign in</a></p>
</div>

<select id="themeSelect" class="form-select form-select-sm theme-select">
    <option value="light">🌞 Light</option>
    <option value="dark">🌙 Dark</option>
    <option value="sunset">🌅 Sunset</option>
    <option value="forest">🌲 Forest</option>
    <option value="royal">👑 Royal</option>
</select>

<script>
    (function() {
        const root = document.documentElement;
        const select = document.getElementById('themeSelect');

        function applyTheme(theme) {
            root.setAttribute('data-theme', theme);
            try { localStorage.setItem('anveshana-theme', theme); } catch(e){}
        }

        const saved = localStorage.getItem('anveshana-theme');
        if(saved) { select.value = saved; applyTheme(saved); }

        select.addEventListener('change', () => applyTheme(select.value));
    })();
</script>
</body>
</html>
