<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Anveshana – India's Search Engine 🇮🇳</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ================= THEME VARIABLES ================= */
        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --accent-color: #1a73e8;
            --input-bg: #ffffff;
            --input-border: #dfe1e5;
            --placeholder-color: #80868b;
            --dropdown-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0b1120;
            --text-color: #e5e7eb;
            --accent-color: #38bdf8;
            --input-bg: #111827;
            --input-border: #374151;
            --placeholder-color: #9ca3af;
            --dropdown-bg: #020617;
        }

        [data-theme="sunset"] {
            --bg-color: #fff7ed;
            --text-color: #1f2933;
            --accent-color: #f97316;
            --input-bg: #fffbeb;
            --input-border: #fed7aa;
            --placeholder-color: #9a3412;
            --dropdown-bg: #fffbeb;
        }

        [data-theme="forest"] {
            --bg-color: #0f172a;
            --text-color: #e2f3e9;
            --accent-color: #22c55e;
            --input-bg: #020617;
            --input-border: #14532d;
            --placeholder-color: #86efac;
            --dropdown-bg: #020617;
        }

        [data-theme="royal"] {
            --bg-color: #f5f3ff;
            --text-color: #111827;
            --accent-color: #6366f1;
            --input-bg: #eef2ff;
            --input-border: #c7d2fe;
            --placeholder-color: #4f46e5;
            --dropdown-bg: #eef2ff;
        }

        /* ================= BASE ================= */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        }

        /* ================= TOP BAR ================= */
        .top-bar {
            position: absolute;
            top: 16px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ================= PROFILE ================= */
        .profile-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-weight: 600;
            background-color: var(--accent-color);
            color: white;
            border: none;
        }

        .dropdown-menu {
            background-color: var(--dropdown-bg);
        }

        /* ================= THEME DROPDOWN ================= */
        .theme-select {
            font-size: 0.75rem;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            background-color: var(--dropdown-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
        }

        .theme-select option {
            background-color: var(--dropdown-bg);
            color: var(--text-color);
        }

        /* ================= CENTER ================= */
        .center-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .logo {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            margin-bottom: 0.8rem;
        }

        .logo span {
            color: var(--accent-color);
        }

        .tagline {
            font-size: 1rem;
            opacity: 0.75;
            margin-bottom: 2.2rem;
        }

        /* ================= SEARCH ================= */
        .search-box {
            width: 100%;
            max-width: 640px;
        }

        .search-input {
            height: 48px;
            border-radius: 999px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            padding: 0 18px;
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: var(--placeholder-color);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 1px 6px rgba(0,0,0,0.15);
        }

        .search-btn {
            margin-top: 1.2rem;
            padding: 0.5rem 1.6rem;
            border-radius: 6px;
            background-color: var(--accent-color);
            border: none;
            color: white;
            font-size: 0.9rem;
        }

        .search-btn:hover {
            filter: brightness(0.95);
        }

        /* ================= BOOKMARKS ================= */
        .bookmarks {
            margin-top: 3rem;
            width: 100%;
            max-width: 640px;
        }

        .bookmark-title {
            font-size: 0.9rem;
            color: var(--accent-color);
            text-decoration: none;
        }

        .bookmark-path {
            font-size: 0.75rem;
            opacity: 0.6;
        }
    </style>
</head>

<body>

<!-- ================= TOP BAR ================= -->
<div class="top-bar">

    <!-- Logged out -->
    <div th:if="${#authentication == null or !#authentication.authenticated}">
        <a href="/login" class="btn btn-sm btn-outline-secondary">Login</a>
        <a href="/signup" class="btn btn-sm btn-outline-primary">Sign up</a>
    </div>

    <!-- Logged in -->
    <div class="dropdown"
         th:if="${#authentication != null and #authentication.authenticated}">
        <button class="profile-btn dropdown-toggle"
                data-bs-toggle="dropdown">
            <span th:text="${#authentication.name.substring(0,1).toUpperCase()}">U</span>
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
            <li class="dropdown-header"
                th:text="${#authentication.name}">username</li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" th:href="@{/bookmarks}">My Bookmarks</a></li>
            <li>
                <form th:action="@{/logout}" method="post">
                    <button class="dropdown-item text-danger">Logout</button>
                </form>
            </li>
        </ul>
    </div>

    <!-- Theme -->
    <select id="themeSelect" class="theme-select">
        <option value="light">🌞 Light</option>
        <option value="dark">🌙 Dark</option>
        <option value="sunset">🌅 Sunset</option>
        <option value="forest">🌲 Forest</option>
        <option value="royal">👑 Royal</option>
    </select>
</div>

<!-- ================= CENTER ================= -->
<div class="center-wrapper">
    <div class="text-center">
        <div class="logo">
            <span>🔍 Anveshana</span>
        </div>
        <div class="tagline">
            India's open-source search engine for your local documents
        </div>

        <form action="/search" method="GET" class="search-box">
            <input
                    type="text"
                    name="q"
                    class="form-control search-input"
                    placeholder="Search anything in your knowledge base…"
                    autofocus
                    required
            >
            <button class="search-btn" type="submit">Search</button>
        </form>
    </div>

    <!-- Bookmarks -->
    <div th:if="${#authentication != null and #authentication.authenticated
                 and bookmarks != null and !#lists.isEmpty(bookmarks)}"
         class="bookmarks">
        <h6 class="mb-2">Your bookmarks</h6>
        <ul class="list-unstyled">
            <li th:each="b : ${bookmarks}" class="mb-2">
                <a th:href="@{'/document/' + ${b.docId}(page=0)}"
                   class="bookmark-title">
                    <span th:text="${b.title != null ? b.title : 'Document ' + b.docId}"></span>
                </a>
                <div class="bookmark-path" th:text="${b.path}"></div>
            </li>
        </ul>
    </div>
</div>

<!-- ================= SCRIPT ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        const root = document.documentElement;
        const select = document.getElementById('themeSelect');

        function applyTheme(theme) {
            root.setAttribute('data-theme', theme);
            localStorage.setItem('anveshana-theme', theme);
        }

        const saved = localStorage.getItem('anveshana-theme');
        if (saved) {
            select.value = saved;
            applyTheme(saved);
        }

        select.addEventListener('change', () => applyTheme(select.value));
    })();
</script>

</body>
</html>
