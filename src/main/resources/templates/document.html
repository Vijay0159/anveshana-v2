<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title th:text="'Document ' + ${docId} + ' - Anveshana'">Document - Anveshana</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* =====================
           THEME VARIABLES
        ====================== */
        :root {
            --bg-color: #f8f9fa;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --text-color: #212529;
            --accent-color: #0d6efd;
            --border-color: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #0b1120;
            --nav-bg: #020617;
            --card-bg: #111827;
            --text-color: #e5e7eb;
            --accent-color: #38bdf8;
            --border-color: rgba(255,255,255,0.12);
        }

        [data-theme="sunset"] {
            --bg-color: #fff7ed;
            --nav-bg: #fffbeb;
            --card-bg: #ffffff;
            --text-color: #1f2933;
            --accent-color: #f97316;
            --border-color: rgba(0,0,0,0.12);
        }

        [data-theme="forest"] {
            --bg-color: #0f172a;
            --nav-bg: #020617;
            --card-bg: #020617;
            --text-color: #e2f3e9;
            --accent-color: #22c55e;
            --border-color: rgba(255,255,255,0.15);
        }

        [data-theme="royal"] {
            --bg-color: #f5f3ff;
            --nav-bg: #eef2ff;
            --card-bg: #ffffff;
            --text-color: #111827;
            --accent-color: #6366f1;
            --border-color: rgba(0,0,0,0.12);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* =====================
           TOP NAV
        ====================== */
        .top-nav {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            text-decoration: none;
        }

        .search-input {
            border-radius: 999px;
            padding: 0.45rem 1rem;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .search-input::placeholder {
            color: rgba(148,163,184,0.8);
        }

        /* =====================
           THEME DROPDOWN
        ====================== */
        .theme-select {
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            min-width: 135px;
        }

        .theme-select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        /* =====================
           PROFILE
        ====================== */
        .profile-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            font-weight: 600;
        }

        .dropdown-menu {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .dropdown-item {
            color: var(--text-color);
        }

        .dropdown-item:hover {
            background-color: rgba(148,163,184,0.15);
        }

        /* =====================
           DOCUMENT CARD
        ====================== */
        .doc-card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.2);
            padding: 2rem 2.5rem;
            margin-top: 1.5rem;
        }

        .path-muted {
            font-size: 0.85rem;
            opacity: 0.65;
        }

        mark {
            background-color: rgba(250, 204, 21, 0.45);
            padding: 0 2px;
            border-radius: 2px;
        }
    </style>
</head>

<body>

<!-- =====================
     TOP NAV
===================== -->
<nav class="top-nav">
    <div class="d-flex align-items-center gap-3">
        <a href="/" class="logo">Anveshana</a>

        <form th:action="@{/search}" method="get" class="flex-grow-1">
            <input type="text"
                   name="q"
                   class="form-control search-input"
                   placeholder="Search Anveshana"
                   th:value="${query}">
        </form>

        <select id="themeSelect" class="theme-select">
            <option value="light">🌞 Light</option>
            <option value="dark">🌙 Dark</option>
            <option value="sunset">🌅 Sunset</option>
            <option value="forest">🌲 Forest</option>
            <option value="royal">👑 Royal</option>
        </select>

        <div class="dropdown">
            <button class="profile-btn dropdown-toggle" data-bs-toggle="dropdown">
                <span th:text="${#authentication.name.substring(0,1).toUpperCase()}"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" th:href="@{/bookmarks}">My Bookmarks</a></li>
                <li><a class="dropdown-item" th:href="@{/ai-library}">My AI Library</a></li>
                <li><a class="dropdown-item" th:href="@{/groups}">My Groups</a></li>
                <li>
                    <form th:action="@{/logout-and-clear}" method="post">
                        <button type="submit" class="dropdown-item">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- =====================
     DOCUMENT CONTENT
===================== -->
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="doc-card">

                <div class="d-flex align-items-center gap-2 mb-3">
                    <a th:if="${hasValidQuery}"
                       th:href="@{/search(q=${query}, page=${page})}"
                       class="btn btn-outline-secondary btn-sm">← Back to results</a>

                    <a href="/" class="btn btn-outline-secondary btn-sm">🏠 Home</a>

                    <!-- Bookmark (unchanged logic) -->
                    <form th:if="${#authentication != null and #authentication.authenticated and !isBookmarked}"
                          th:action="@{/bookmarks/add}" method="post" class="d-inline">
                        <input type="hidden" name="docId" th:value="${docId}"/>
                        <input type="hidden" name="path" th:value="${path}"/>
                        <input type="hidden" name="title"
                               th:value="${#strings.substring(path, path.lastIndexOf('\\') + 1)}"/>
                        <input type="hidden" name="q" th:value="${query}"/>
                        <input type="hidden" name="page" th:value="${page}"/>
                        <button type="submit" class="btn btn-primary btn-sm">★ Bookmark</button>
                    </form>

                    <form th:if="${#authentication != null and #authentication.authenticated and isBookmarked}"
                          th:action="@{/bookmarks/remove}" method="post" class="d-inline">
                        <input type="hidden" name="docId" th:value="${docId}"/>
                        <input type="hidden" name="q" th:value="${query}"/>
                        <input type="hidden" name="page" th:value="${page}"/>
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            ✕ Remove bookmark
                        </button>
                    </form>
                </div>

                <h5 class="mb-1">Document <span th:text="${docId}"></span></h5>
                <div class="path-muted mb-3" th:text="${path}"></div>

                <div class="border rounded p-3" style="white-space: pre-wrap;">
                    <span th:utext="${content}"></span>
                </div>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    (function () {
        const root = document.documentElement;
        const select = document.getElementById("themeSelect");

        function applyTheme(theme) {
            root.setAttribute("data-theme", theme);
            localStorage.setItem("anveshana-theme", theme);
        }

        const saved = localStorage.getItem("anveshana-theme");
        if (saved) {
            select.value = saved;
            applyTheme(saved);
        }

        select.addEventListener("change", () => applyTheme(select.value));
    })();
</script>

</body>
</html>
