<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Join Group – Anveshana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color:#f0f2f5; --card-bg:#ffffff; --text-color:#1f2937;
            --accent-color:#0d6efd; --border-color:#e0e0e0;
            --shadow-color:rgba(15,23,42,0.15);
        }
        [data-theme="dark"] {
            --bg-color:#0b1120; --card-bg:#111827;
            --text-color:#e5e7eb; --accent-color:#38bdf8; --border-color:#374151;
        }
        [data-theme="sunset"] {
            --bg-color:#fff7ed; --card-bg:#fffbeb;
            --text-color:#1f2933; --accent-color:#f97316; --border-color:#fcd34d;
        }
        [data-theme="forest"] {
            --bg-color:#0f172a; --card-bg:#020617;
            --text-color:#e2f3e9; --accent-color:#22c55e; --border-color:#047857;
        }
        [data-theme="royal"] {
            --bg-color:#f5f3ff; --card-bg:#eef2ff;
            --text-color:#111827; --accent-color:#6366f1; --border-color:#a5b4fc;
        }
        body {
            background-color:var(--bg-color); color:var(--text-color);
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            font-family:'Inter', sans-serif;
        }
        .confirm-card {
            background-color:var(--card-bg);
            border:1px solid var(--border-color);
            border-radius:1rem;
            box-shadow:0 10px 30px var(--shadow-color);
            padding:2.5rem;
            max-width:460px; width:100%;
            text-align:center;
        }
        .group-icon {
            font-size:3rem; margin-bottom:1rem;
        }
        .group-name {
            font-size:1.4rem; font-weight:700;
            color:var(--accent-color); margin-bottom:0.3rem;
        }
        .inviter-info {
            font-size:0.9rem; opacity:0.7; margin-bottom:1.5rem;
        }
        .expiry-info {
            font-size:0.8rem; opacity:0.5; margin-bottom:2rem;
        }
        .btn-confirm {
            background:linear-gradient(135deg, var(--accent-color) 0%, #0b5ed7 100%);
            border:none; color:#fff; padding:0.75rem 2rem;
            border-radius:0.75rem; font-weight:600; font-size:1rem;
            transition:all 0.2s; width:100%; margin-bottom:0.75rem;
        }
        .btn-confirm:hover { filter:brightness(1.08); transform:translateY(-1px); }
        .btn-decline {
            background:none; border:1px solid var(--border-color);
            color:var(--text-color); padding:0.65rem 2rem;
            border-radius:0.75rem; font-weight:500; font-size:0.9rem;
            width:100%; transition:all 0.2s;
        }
        .btn-decline:hover { opacity:0.7; }
        .theme-select {
            max-width:140px; font-size:0.875rem; padding:0.4rem 0.6rem;
            border-radius:0.5rem; border:2px solid var(--border-color);
            background-color:var(--card-bg); color:var(--text-color);
            position:fixed; bottom:1rem; right:1rem;
        }
    </style>
</head>
<body>

<div class="confirm-card">

    <!-- Error state (invalid/expired token) -->
    <div th:if="${error != null}">
        <div class="group-icon">⚠️</div>
        <div class="group-name">Invitation Invalid</div>
        <p class="inviter-info" th:text="${error}"></p>
        <a href="/groups" class="btn btn-confirm text-decoration-none d-block">
            Go to My Groups
        </a>
    </div>

    <!-- Valid invite confirmation -->
    <div th:if="${invitation != null}">
        <div class="group-icon">👥</div>
        <div class="group-name" th:text="${invitation.group.name}"></div>
        <div class="inviter-info">
            <strong th:text="${invitation.invitedBy.fullName}"></strong>
            has invited you to join this group on Anveshana
        </div>
        <div class="expiry-info">
            This invite expires on
            <strong th:text="${#temporals.format(invitation.expiresAt, 'dd MMM yyyy, HH:mm')}"></strong>
        </div>

        <!-- Accept -->
        <form th:action="@{/groups/join/accept}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <button type="submit" class="btn-confirm">✅ Join Group</button>
        </form>

        <!-- Decline -->
        <form th:action="@{/groups/join/decline}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <button type="submit" class="btn-decline">Decline</button>
        </form>

        <p class="mt-3" style="font-size:0.8rem;opacity:0.5;">
            You'll be added as a member of
            "<span th:text="${invitation.group.name}"></span>"
        </p>
    </div>

</div>

<select id="themeSelect" class="form-select theme-select">
    <option value="light">🌞 Light</option>
    <option value="dark">🌙 Dark</option>
    <option value="sunset">🌅 Sunset</option>
    <option value="forest">🌲 Forest</option>
    <option value="royal">👑 Royal</option>
</select>

<script>
    (function () {
        const root = document.documentElement;
        const select = document.getElementById('themeSelect');
        function applyTheme(t) {
            root.setAttribute('data-theme', t);
            localStorage.setItem('anveshana-theme', t);
        }
        const saved = localStorage.getItem('anveshana-theme');
        if (saved) { select.value = saved; applyTheme(saved); }
        select.addEventListener('change', () => applyTheme(select.value));
    })();
</script>
</body>
</html>
